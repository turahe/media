version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - turahe
    assignees:
      - turahe
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - composer
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: orchestra/testbench
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - turahe
    assignees:
      - turahe
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
