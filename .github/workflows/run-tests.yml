name: Run tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependency-versions }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        dependency-versions: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12'
            testbench: '10.0'
          - laravel: '13'
            testbench: '11.0'
          - php: '8.4'
            laravel: '13'
            dependency-versions: prefer-stable
            coverage: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependency-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.dependency-versions }}-
            composer-${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, imagick, pdo_sqlite, zip
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --${{ matrix.dependency-versions }} --with="laravel/framework:^${{ matrix.laravel }}.0" --with="orchestra/testbench:^${{ matrix.testbench }}"

      - name: Execute tests
        run: vendor/bin/phpunit --do-not-cache-result ${{ matrix.coverage && '--coverage-clover=coverage.xml' || '' }}

      - name: Upload coverage
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1
          if-no-files-found: error

  sonarqube:
    name: SonarQube
    needs: test
    if: needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
